  <header>
    <div class ="welcome">
      <!-- one heading and one line, so screen readers do not hear five heading fragments -->
      <h1><span id="hello">Hello</span> <span id="usr">usr</span>!</h1>
      <p id="creditDisplay" class="credit"><img class="coin" src="img/textures/coin.webp" alt=""><span id="your_credit">Credit</span> <span class="amount">SEK <span id="cre">cre</span>:-</span></p>
    </div>


    </header>

    <div class="menu">

        <ul class="menu_tabs">
            <li><button type="button" class="all" id="all" aria-pressed="false">All</button></li>
            <li><button type="button" class="beers" id="beers" aria-pressed="false">Beers</button></li>
            <li><button type="button" class="wines" id="wines" aria-pressed="false">Wines</button></li>
            <li><button type="button" class="spirits" id="spirits" aria-pressed="false">Spirits</button></li>
            <li><button type="button" class="kosher" id="kosher" aria-pressed="false">Kosher</button></li>
            <li><button type="button" class="ecologic" id="ecologic" aria-pressed="false">Ecologic</button></li>
            <li><button type="button" class="specials" id="specials" aria-pressed="false">Specials</button></li>
        </ul>

    </div>

    <div class="dropdown"><button type="button" class="menu_toggle" id="menu_toggle" aria-label="Drink categories" aria-expanded="false" aria-controls="category_list"><svg class="icon icon-2x" aria-hidden="true"><use href="img/icons.svg#menu"/></svg></button>
        <ul class="dropdown-content" id="category_list">
            <li><button type="button" class="all" id="all" aria-pressed="false">All</button></li>
            <li><button type="button" class="beers" id="beers" aria-pressed="false">Beers</button></li>
            <li><button type="button" class="wines" id="wines" aria-pressed="false">Wines</button></li>
            <li><button type="button" class="spirits" id="spirits" aria-pressed="false">Spirits</button></li>
            <li><button type="button" class="kosher" id="kosher" aria-pressed="false">Kosher</button></li>
            <li><button type="button" class="ecologic" id="ecologic" aria-pressed="false">Ecologic</button></li>
            <li><button type="button" class="specials" id="specials" aria-pressed="false">Specials</button></li>
        </ul>
    </div>
    

    
<div class="main_section">
  
    <div class="drink_list" id="drink_database" tabindex="0" role="region" aria-label="Drinks">
      <!-- Drinks Database loads here -->
    </div>

    <div class="selection_header">
      <h2 id="your_order">Your Order</h2>
    </div>
    
    <!-- Drink Selection pops up here; kept free of whitespace so :empty shows the note (T7) -->
    <div class="selection" id="drink_selection" data-empty="Nothing ordered yet. Choose a drink to add it."></div>
    
    <div class="checkout">
      <h2 id="total"><small>Total:</small> <span>SEK 0:-</span></h2>
      <button type="button" id="order_toggle" class="order_toggle" aria-expanded="false" aria-controls="drink_selection" aria-label="Your Order"></button>
    </div>

</div>


    <!-- pay button for small screen -->
    <button type="button" class="pay_button blue" id="pay_phone">Place Order</button>

    <footer>
      <!-- LOG OUT BUTTON -->
      <button type="button" onclick="logOut()" class="small_button red logout" id="logout">Log Out</button>

      <!-- LANGUAGE MENU -->
      <div class="languages_menu">
        <a href="#" id="eng" lang="en"><div class="languages"> <img src="img/textures/flag-eng.webp" alt="English"></div></a>
        <a href="#" id="sve" lang="sv"><div class="languages"> <img src="img/textures/flag-sve.webp" alt="Svenska"></div></a>
        <a href="#" id="ita" lang="it"><div class="languages"> <img src="img/textures/flag-ita.webp" alt="Italiano"></div></a>
        <a href="#" id="esp" lang="es"><div class="languages"> <img src="img/textures/flag-esp.webp" alt="Español"></div></a>
        <a href="#" id="pirate" lang="en"><div class="languages"> <img src="img/textures/flag-pirate.webp" alt="Pirate"></div></a>
      </div>

      <!-- UNDO-REDO MENU -->
      <div class="undo_redo_menu">
        <button type="button" id="undo" class="fade"><span class="anchor" aria-hidden="true"></span> <span class="undo_label">Undo</span></button>
        <button type="button" id="redo" class="fade"><span class="anchor" aria-hidden="true"></span> <span class="redo_label">Redo</span></button>
      </div>

      <!-- PAY BUTTON -->
      <button type="button" class="small_button blue" id="pay">Place Order</button>

    </footer>

    <span id="remove_word" hidden>Remove</span>
