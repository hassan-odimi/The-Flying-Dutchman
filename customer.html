  <header>
    <div class ="welcome">

      <p id="creditDisplay" class="credit"><span id="your_credit">Your credit is </span><span id="cre">cre</span></p>
    </div>


    </header>

    <div class="menu">

        <ul class="menu_tabs">
            <li><button type="button" class="all" id="all" aria-pressed="false">All</button></li>
            <li><button type="button" class="beers" id="beers" aria-pressed="false">Beers</button></li>

        </ul>

    </div>

    <div class="dropdown"><button type="button" class="menu_toggle" id="menu_toggle" aria-label="Drink categories"><i class="fa fa-bars fa-2x" aria-hidden="true"></i></button>
        <ul class="dropdown-content">
            <li><button type="button" class="all" id="all" aria-pressed="false">All</button></li>
            <li><button type="button" class="beers" id="beers" aria-pressed="false">Beers</button></li>

    <!-- logout button for small screen -->
    <button type="button" onclick="logOut()" class="log_button red logout" id="logout">Log Out</button>

    
<div class="main_section">
  
    <div class="drink_list" id="drink_database" tabindex="0" role="region" aria-label="Drinks">
      <!-- Drinks Database loads here -->
    </div>

    <div class="selection_header">
      <h2 id="your_order">Your Order</h2>
    </div>
    
    <div class="selection" id="drink_selection">
      <!-- Drink Selection pops up here -->
    </div>
    
    <div class="checkout" onClick="if ($(window).width() <= 768) {$('.selection').toggle()}">
      <h2 id="total">Total: SEK 0 :-</h2>
    </div>

</div>


    <!-- pay button for small screen -->
    <button type="button" class="pay_button blue" id="pay">Place Order</button>

    <footer>
      <!-- LOG OUT BUTTON -->
      <button type="button" onclick="logOut()" class="small_button red logout" id="logout">Log Out</button>

      <!-- LANGUAGE MENU -->
      <div class="languages_menu">
        <a href="#" id="eng" lang="en"><div class="languages"> <img src="img/eng.png" alt="English"></div></a>
        <a href="#" id="sve" lang="sv"><div class="languages"> <img src="img/sve.png" alt="Svenska"></div></a>

        <a href="#" id="esp" lang="es"><div class="languages"> <img src="img/esp.png" alt="Español"></div></a>

      </div>

        <button type="button" id="undo" class="fade"><i class="fa fa-undo fa-2x" aria-hidden="true"></i> <span class="undo_label">Undo</span></button>
        <button type="button" id="redo" class="fade"><i class="fa fa-repeat fa-2x" aria-hidden="true"></i> <span class="redo_label">Redo</span></button>
      </div>

      <!-- PAY BUTTON -->
      <button type="button" class="small_button blue" id="pay">Place Order</button>
