<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!-- Metadata-->
    <title id="page_title">The Flying Dutchman</title>
    <meta name="Description goes here" content="">
    <meta name="Pirates of the Caribbean" content="tags go here">

    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.png">


    <!-- CSS Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- External CSS sheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/management.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Berkshire+Swash|Oswald" rel="stylesheet">

  </head>
  <body>
    <!-- Your code starts here -->

    <header>

      <div class="title">
        <h1 id="title">Drink Delivery Database System</h1>
      </div>
      
 <div class="info"><span style="font-weight:bold; color:white">Manager: </span><span id="usr" style="color:white">usr</span></div>  
          
    </header>
    <div class="menu">
      <ul class="type_menu">
        <li><button type="button" id="drinks_list" aria-pressed="false">Full Drinks List</button></li>
        <li><button type="button" id="check_stock" aria-pressed="false">Check Bar Stock</button></li>
        <li><button type="button" id="specials_db" aria-pressed="false">Specials</button></li>
        <li><button type="button" id="shortage_alert" aria-pressed="false">Shortage Alert (!)</button></li>
      </ul>
    </div>


    <div class="main_section">

        <div class="drink_list" id="drink_database" tabindex="0" role="region" aria-label="Drinks">
            <!-- Drinks Database loads here -->
        </div>


        <div class="selection_header">
            <h2 id="your_order">Your Order</h2>
        </div>

        <div class="selection" id="drink_selection">
            <!-- Drink Selection pops up here -->
        </div>

    <div class="checkout">
      <h2 id="total">Total: SEK 0 :-</h2>
    </div>

    <footer>

      <!-- LOG OUT BUTTON -->
      <button type="button" onclick="logOut()" class="small_button red logout" id="logout">Log Out</button>

      <!-- LANGUAGE MENU -->
      <div class="languages_menu">
        <a href="#" id="eng" lang="en"><div class="languages"> <img src="img/eng.png" alt="English"></div></a>
        <a href="#" id="sve" lang="sv"><div class="languages"> <img src="img/sve.png" alt="Svenska"></div></a>
        <a href="#" id="ita" lang="it"><div class="languages"> <img src="img/ita.png" alt="Italiano"></div></a>
        <a href="#" id="esp" lang="es"><div class="languages"> <img src="img/esp.png" alt="Español"></div></a>
        <a href="#" id="pirate" lang="en"><div class="languages"> <img src="img/pirate.jpg" alt="Pirate"></div></a>
      </div>

      <!-- UNDO-REDO MENU -->
      <div class="undo_redo_menu">
        <button type="button" id="undo" class="fade"><i class="fa fa-undo fa-2x" aria-hidden="true"></i> <span class="undo_label">Undo</span></button>
        <button type="button" id="redo" class="fade"><i class="fa fa-repeat fa-2x" aria-hidden="true"></i> <span class="redo_label">Redo</span></button>
      </div>

      <!-- PAY BUTTON -->
      <button type="button" class="small_button blue" id="pay">Place Stock Order</button>
    </footer>

    <!-- Your code ends here -->

    <!-- Shared first half of every remove button's name -->
    <span id="remove_word" hidden>Remove</span>

    <!-- External Scripts -->

    <!-- JQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    
    <!-- Load Database -->
    <script src="db/DB.js" type="text/javascript"></script>
    <script src="db/DB_SYSTEMBOLAGET.js" type="text/javascript"></script>
    <script src="db/DB_MIKES.js" type="text/javascript"></script>

    <!-- Scripts -->
    <script src="js/view/view_common.js" type="text/javascript"></script>
    <script src="js/view/view_management.js" type="text/javascript"></script>

    <script src="js/management.js" type="text/javascript"></script>
    <script src="js/login.js" type="text/javascript"></script>
    <script src="js/multilanguage.js" type="text/javascript"></script>

  </body>
</html>
